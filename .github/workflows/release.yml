# 推 tag（v*）自动构建并发布 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (win-x64, self-contained)
        run: dotnet publish DesktopZones.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path "publish/*" -DestinationPath "releases/DeskOrder-win-Portable.zip" -Force

      - name: Inno Setup compile
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:VER = ("${{ github.ref_name }}" -replace '^v','')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VER tools/DeskOrder.iss

      # 文件名固定不带版本号：releases/latest/download/DeskOrder-win-Setup.exe 永远最新
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}" --generate-notes
          "releases/DeskOrder-win-Setup.exe"
          "releases/DeskOrder-win-Portable.zip"
