<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad-zone-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-zone-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-zone-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-zone-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 方案 A: 不规则四分区 -->
  <!-- 大区域 - 左上 -->
  <rect x="16" y="16" width="144" height="128" rx="8" fill="url(#grad-zone-1)"/>
  <!-- 中区域 - 右上 -->
  <rect x="168" y="16" width="72" height="80" rx="8" fill="url(#grad-zone-2)"/>
  <!-- 小区域 - 左下 -->
  <rect x="16" y="152" width="96" height="88" rx="8" fill="url(#grad-zone-3)"/>
  <!-- 最小区域 - 右下 -->
  <rect x="120" y="104" width="120" height="136" rx="8" fill="url(#grad-zone-4)"/>

  <!-- 分割线 - 白色强调 -->
  <line x1="160" y1="16" x2="160" y2="240" stroke="#fff" stroke-width="4" opacity="0.9"/>
  <line x1="16" y1="144" x2="240" y2="144" stroke="#fff" stroke-width="4" opacity="0.9"/>
  <line x1="120" y1="104" x2="240" y2="104" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="112" y1="144" x2="112" y2="240" stroke="#fff" stroke-width="2" opacity="0.6"/>
</svg>
